    <script>
      window.global = window;

      /* ================================================================
       * iOS / WKWebView navigator.mediaDevices polyfill
       *
       * Problem:
       *   iOS Safari (and WKWebView used by Capacitor / in-app browsers)
       *   sets navigator.mediaDevices = undefined even though the
       *   underlying webkit shims are fully functional.  The meta-tag alone
       *   is not enough: cached PWAs, WKWebView, and some in-app Safari
       *   contexts still strip the property.
       *
       * What this does:
       *   1. Detects when navigator.mediaDevices is undefined but
       *      webkit* equivalents exist (or the property simply needs to be
       *      re-defined on the prototype chain).
       *   2. Re-creates the standard navigator.mediaDevices object with
       *      getUserMedia / getDisplayMedia / enumerateDevices / ondevicechange
       *      using the iOS webkit shims.
       *   3. Injects playsInline into every <video> created via
       *      document.createElement('video') so iOS inline playback works
       *      the moment the element touches the DOM.
       * ================================================================ */
      (function () {
        'use strict';

        /* ── helpers ── */
        function getUA() { return navigator.userAgent || ''; }
        var isIOS = /iP(hone|od|ad)(?!.*Safari)|iPhone/.test(getUA());
        var isWebKit = /WebKit/.test(getUA());
        var hasProxy = typeof navigator.webkitGetUserMedia === 'function' ||
                       typeof navigator.webkitGetDisplayMedia === 'function';

         /* Rebuild mediaDevices from webkit shims when missing */
         function rebuildMediaDevices() {
           var origMD = navigator.mediaDevices;
           var origAddEventListener = origMD && typeof origMD.addEventListener === 'function'
             ? origMD.addEventListener.bind(origMD)
             : null;
           var origRemoveEventListener = origMD && typeof origMD.removeEventListener === 'function'
             ? origMD.removeEventListener.bind(origMD)
             : null;
           var MD = {};

          /* getDisplayMedia */
          if (typeof navigator.webkitGetDisplayMedia === 'function') {
            MD.getDisplayMedia = function (constraints) {
              // webkitGetDisplayMedia returns a MediaStream synchronously
              // (no callback form on modern iOS)
              return navigator.webkitGetDisplayMedia(constraints);
            };
          }

          /* getUserMedia */
          if (typeof navigator.webkitGetUserMedia === 'function') {
            // Modern iOS: Promise-based, identical signature to the standard API
            MD.getUserMedia = function (constraints) {
              return navigator.webkitGetUserMedia(constraints);
            };
          }

          /* enumerateDevices — uses MediaDevices.prototype if available */
          if (origMD && typeof origMD.enumerateDevices === 'function') {
            var origEnumerateDevices = origMD.enumerateDevices.bind(origMD);
            MD.enumerateDevices = function () {
              return origEnumerateDevices();
            };
          }

          /* devicechange noop listener */
          var changeListeners = [];
           Object.defineProperty(MD, 'ondevicechange', {
             get: function () { return this._ondevicechange; },
             set: function (fn) {
               this._ondevicechange = fn;
               if (origAddEventListener) {
                 origAddEventListener('devicechange', fn);
               }
             }
           });

          MD.addEventListener = function (type, listener) {
            if (type === 'devicechange') changeListeners.push(listener);
            if (origAddEventListener) {
              origAddEventListener(type, listener);
            }
          };

          MD.removeEventListener = function (type, listener) {
            var i = changeListeners.indexOf(listener);
            if (i > -1) changeListeners.splice(i, 1);
            if (origRemoveEventListener) {
              origRemoveEventListener(type, listener);
            }
          };

          Object.defineProperty(navigator, 'mediaDevices', {
            value: MD,
            writable: true,
            configurable: true,
            enumerable: true,
          });

          console.info('[iOS Polyfill] navigator.mediaDevices rebuilt:', {
            getUserMedia: typeof MD.getUserMedia === 'function',
            getDisplayMedia: typeof MD.getDisplayMedia === 'function',
            enumerateDevices: typeof MD.enumerateDevices === 'function',
          });
        }

        /* Force playsInline on every <video> created via the DOM API */
        function injectPlaysInline() {
          var orig = document.createElement;
          document.createElement = function (tag) {
            var el = orig.call(document, tag);
            if (el.tagName === 'VIDEO') {
              /* Attribute-level guard – fires before React/JSX attaches */
              el.setAttribute('playsinline', '');
              el.setAttribute('webkit-playsinline', '');

              /* Property-level guard for JS-assigned videos */
              Object.defineProperty(el, 'playsInline', {
                get: function () { return true; },
                set: function (_v) { /* ignore nothingness */ },
                configurable: true,
              });

              /* Block autoplay-without-muted snagging iOS video pipeline */
              el.addEventListener('loadedmetadata', function onLoadMD() {
                el.removeEventListener('loadedmetadata', onLoadMD);
                if (!el.muted) {
                  el.muted = true; /* caller must un-mute explicitly */
                }
              });
            }
            return el;
          };
        }

        /* ── run ── */
        if (isIOS || isWebKit) {
          injectPlaysInline();
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            rebuildMediaDevices();
          }
        }
      })();
    </script>
