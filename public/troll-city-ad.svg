<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="50%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Simulated Sidebar (left 160px) -->
  <rect x="0" y="0" width="160" height="630" fill="#0f0c29" stroke="#fbbf24" stroke-opacity="0.2" stroke-width="1"/>
  <!-- Sidebar header -->
  <rect x="0" y="0" width="160" height="60" fill="#1a1a3a" stroke="#fbbf24" stroke-opacity="0.15" stroke-width="1"/>
  <text x="80" y="38" font-family="Arial Black" font-size="20" fill="white" text-anchor="middle" font-weight="900">Mai Troll</text>
  
  <!-- Sidebar Icons (Grid Layout) -->
  <g fill="#fbbf24" font-family="Arial" font-size="10" text-anchor="middle" fill-opacity="0.9">
    <!-- Row 1 -->
    <g transform="translate(40, 90)">
      <circle r="18" fill="#fbbf24" fill-opacity="0.15"/>
      <text y="32" font-size="8">Home</text>
    </g>
    <g transform="translate(120, 90)">
      <circle r="18" fill="#22c55e" fill-opacity="0.15"/>
      <text y="32" font-size="8" fill="#22c55e">Auctions</text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(40, 150)">
      <circle r="18" fill="#8b5cf6" fill-opacity="0.15"/>
      <text y="32" font-size="8" fill="#a78bfa">Troll Town</text>
    </g>
    <g transform="translate(120, 150)">
      <circle r="18" fill="#ec4899" fill-opacity="0.15"/>
      <text y="32" font-size="8" fill="#f472b6">Living</text>
    </g>
    <!-- Row 3 -->
    <g transform="translate(40, 210)">
      <circle r="18" fill="#06b6d4" fill-opacity="0.15"/>
      <text y="32" font-size="8" fill="#22d3ee">Inventory</text>
    </g>
    <g transform="translate(120, 210)">
      <circle r="18" fill="#22c55e" fill-opacity="0.15"/>
      <text y="32" font-size="8" fill="#4ade80">Market</text>
    </g>
    <!-- Row 4 -->
    <g transform="translate(40, 270)">
      <circle r="18" fill="#eab308" fill-opacity="0.15"/>
      <text y="32" font-size="8" fill="#facc15">Leader</text>
    </g>
    <g transform="translate(120, 270)">
      <circle r="18" fill="#f97316" fill-opacity="0.15"/>
      <text y="32" font-size="8" fill="#fb923c">Credit</text>
    </g>
    <!-- Row 5 -->
    <g transform="translate(40, 330)">
      <circle r="18" fill="#fbbf24" fill-opacity="0.15"/>
      <text y="32" font-size="8">Coins</text>
    </g>
    <g transform="translate(120, 330)">
      <circle r="18" fill="#8b5cf6" fill-opacity="0.15"/>
      <text y="32" font-size="8" fill="#a78bfa">Creator</text>
    </g>
    <!-- Row 6 -->
    <g transform="translate(40, 390)">
      <circle r="18" fill="#ef4444" fill-opacity="0.15"/>
      <text y="32" font-size="8" fill="#f87171">Court</text>
    </g>
    <g transform="translate(120, 390)">
      <circle r="18" fill="#fbbf24" fill-opacity="0.15"/>
      <text y="32" font-size="8" fill="#facc15">President</text>
    </g>
  </g>
  
  <!-- Main Content Area -->
  <rect x="170" y="10" width="1020" height="50" rx="25" fill="#1a1a3a" fill-opacity="0.5"/>
  <text x="180" y="45" font-family="Arial" font-size="16" fill="#a1a1aa" font-weight="500">Welcome to Mai Troll - Your Social Streaming & Battle Arena</text>
  
  <!-- Feature Cards -->
  <g transform="translate(190, 80)">
    <!-- Live Streams Card -->
    <rect width="230" height="180" rx="12" fill="#1e1e3a" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="0" y="0" width="230" height="40" rx="12" fill="#ec4899" fill-opacity="0.2"/>
    <text x="115" y="28" font-family="Arial Black" font-size="18" fill="#ec4899" text-anchor="middle" font-weight="900">LIVE STREAMS</text>
    <g transform="translate(15, 60)" fill="#ffffff" fill-opacity="0.8">
      <circle r="30" fill="none" stroke="#ec4899" stroke-width="3"/>
      <circle r="18" fill="#ec4899"/>
      <text x="0" y="55" font-family="Arial" font-size="11" text-anchor="middle">Watch Live</text>
      <text x="0" y="70" font-family="Arial" font-size="10" fill="#a1a1aa" text-anchor="middle">Interactive show broadcasts</text>
    </g>
    
    <!-- Battle Card -->
    <rect x="250" y="0" width="230" height="180" rx="12" fill="#1e1e3a" stroke="#f97316" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="250" y="0" width="230" height="40" rx="12" fill="#f97316" fill-opacity="0.2"/>
    <text x="365" y="28" font-family="Arial Black" font-size="18" fill="#f97316" text-anchor="middle" font-weight="900">TROLL BATTLES</text>
    <g transform="translate(265, 60)" fill="#ffffff" fill-opacity="0.8">
      <polygon points="30,0 60,30 30,60 0,30" fill="#f97316"/>
      <polygon points="30,30 50,50 30,70 10,50" fill="#fbbf24"/>
      <text x="0" y="55" font-family="Arial" font-size="11" text-anchor="middle">Battle Friends</text>
      <text x="0" y="70" font-family="Arial" font-size="10" fill="#a1a1aa" text-anchor="middle">Compete & climb ranks</text>
    </g>
    
    <!-- Gifts Card -->
    <rect x="500" y="0" width="230" height="180" rx="12" fill="#1e1e3a" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="500" y="0" width="230" height="40" rx="12" fill="#fbbf24" fill-opacity="0.2"/>
    <text x="615" y="28" font-family="Arial Black" font-size="18" fill="#fbbf24" text-anchor="middle" font-weight="900">GIFTS & REWARDS</text>
    <g transform="translate(515, 60)" fill="#ffffff" fill-opacity="0.8">
      <circle r="30" fill="#fbbf24"/>
      <text x="0" y="10" font-family="Arial Black" font-size="28" fill="#1e1e3a" text-anchor="middle">$</text>
      <text x="0" y="55" font-family="Arial" font-size="11" text-anchor="middle">Send Gifts</text>
      <text x="0" y="70" font-family="Arial" font-size="10" fill="#a1a1aa" text-anchor="middle">Earn coins & rewards</text>
    </g>
    
    <!-- Chat Card -->
    <rect x="750" y="0" width="230" height="180" rx="12" fill="#1e1e3a" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="750" y="0" width="230" height="40" rx="12" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="865" y="28" font-family="Arial Black" font-size="18" fill="#8b5cf6" text-anchor="middle" font-weight="900">TCPS CHAT</text>
    <g transform="translate(765, 60)" fill="#ffffff" fill-opacity="0.8">
      <rect x="5" y="10" width="50" height="25" rx="5" fill="#8b5cf6"/>
      <rect x="5" y="40" width="50" height="25" rx="5" fill="#8b5cf6" fill-opacity="0.5"/>
      <text x="0" y="55" font-family="Arial" font-size="11" text-anchor="middle">Messages</text>
      <text x="0" y="70" font-family="Arial" font-size="10" fill="#a1a1aa" text-anchor="middle">Private & group chats</text>
    </g>
  </g>
  
  <!-- More Features Row -->
  <g transform="translate(190, 280)">
    <!-- Leaderboard -->
    <rect width="230" height="170" rx="12" fill="#1e1e3a" stroke="#eab308" stroke-opacity="0.3" stroke-width="1"/>
    <text x="15" y="30" font-family="Arial Black" font-size="14" fill="#eab308" font-weight="900">🏆 LEADERBOARD</text>
    <g transform="translate(15, 50)" font-family="Arial" font-size="11" fill="#ffffff">
      <text x="10" y="0">#1 👑 TopHost</text>
      <text x="10" y="25">#2 🔥 StarStream</text>
      <text x="10" y="50">#3 ⚡ GameKing</text>
      <text x="10" y="75">#4 🎵 MusicQueen</text>
      <text x="10" y="100">#5 🎬 VideoStar</text>
    </g>
    
    <!-- Auctions -->
    <rect x="250" y="0" width="230" height="170" rx="12" fill="#1e1e3a" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1"/>
    <text x="265" y="30" font-family="Arial Black" font-size="14" fill="#22c55e" font-weight="900">⚖️ LIVE AUCTIONS</text>
    <g transform="translate(265, 55)" font-family="Arial" font-size="11" fill="#ffffff">
      <text x="10" y="0">🏎️ Car Auction</text>
      <text x="10" y="30">💎 Rare Gems</text>
      <text x="10" y="60">🏠 Property</text>
      <text x="10" y="90">💰 Coin Packs</text>
      <text x="10" y="120">👑 VIP Access</text>
    </g>
    
    <!-- Families -->
    <rect x="500" y="0" width="230" height="170" rx="12" fill="#1e1e3a" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
    <text x="515" y="30" font-family="Arial Black" font-size="14" fill="#f59e0b" font-weight="900">👨‍👩‍👧‍👦 TROLL FAMILIES</text>
    <g transform="translate(515, 55)" font-family="Arial" font-size="11" fill="#ffffff">
      <text x="10" y="0">Create your family</text>
      <text x="10" y="30">Build your empire</text>
      <text x="10" y="60">Recruit members</text>
      <text x="10" y="90">Family battles</text>
      <text x="10" y="120">Exclusive rewards</text>
    </g>
    
    <!-- Government -->
    <rect x="750" y="0" width="230" height="170" rx="12" fill="#1e1e3a" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1"/>
    <text x="765" y="30" font-family="Arial Black" font-size="14" fill="#ef4444" font-weight="900">🏛️ GOVERNMENT</text>
    <g transform="translate(765, 55)" font-family="Arial" font-size="11" fill="#ffffff">
      <text x="10" y="0">🎖️ Officer HQ</text>
      <text x="10" y="30">📰 TCNN News</text>
      <text x="10" y="60">⚖️ Troll Court</text>
      <text x="10" y="90">🏛️ President</text>
      <text x="10" y="120">📺 Broadcasts</text>
    </g>
  </g>
  
  <!-- Bottom CTA -->
  <rect x="400" y="480" width="400" height="60" rx="30" fill="url(#headerGrad)" filter="url(#glow)"/>
  <text x="600" y="517" font-family="Arial Black" font-size="24" fill="#0f0c29" text-anchor="middle" font-weight="900">JOIN Mai Troll NOW</text>
  
  <!-- Bottom tagline -->
  <text x="600" y="585" font-family="Arial" font-size="18" fill="#a1a1aa" text-anchor="middle">Watch • Chat • Battle • Win • Repeat</text>
  
  <!-- Decorative elements -->
  <g fill="#fbbf24" opacity="0.5">
    <circle cx="50" cy="580" r="2"/>
    <circle cx="30" cy="560" r="3"/>
    <circle cx="70" cy="540" r="2"/>
    <circle cx="1150" cy="570" r="2"/>
    <circle cx="1130" cy="550" r="3"/>
    <circle cx="1170" cy="530" r="2"/>
  </g>
</svg>